# REVIEW TEMPLATE ONLY. Do not apply before region, plans and displayed costs are approved.
# Replace every CHOOSE_* value. This file is intentionally not an applicable Blueprint yet.
services:
  - type: web
    name: playita-api
    runtime: node
    region: CHOOSE_REGION
    plan: CHOOSE_WEB_PLAN
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build:api
    preDeployCommand: npm run db:migrate
    startCommand: npm run start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: DATABASE_TLS_MODE
        value: render-internal
      - key: DATABASE_URL
        fromDatabase:
          name: playita-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: playita-db
    region: CHOOSE_REGION
    plan: CHOOSE_POSTGRES_PLAN
    postgresMajorVersion: "16"
    ipAllowList: []
