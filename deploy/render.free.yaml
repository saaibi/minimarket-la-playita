# Free staging only. Inspect existing workspace resources before applying to avoid duplicates.
# Region is a proposed default; match an existing project database region if reusing it.
# No paid resources, disk, jobs, autoscaling or pre-deploy hooks.
services:
  - type: web
    name: playita-api
    runtime: node
    region: virginia
    plan: free
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: DATABASE_TLS_MODE
        value: render-internal
      - key: DATABASE_URL
        fromDatabase:
          name: playita-db
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost,https://localhost,capacitor://localhost

databases:
  - name: playita-db
    region: virginia
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
